name: One-shot configured importer validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test source
        run: npm test

      - name: Build single-file bundles
        run: npm run bundles

      - name: Test regenerated outputs
        run: npm test

      - name: Commit generated bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/bundle.ts build/bundle.mjs
          git rm .github/workflows/one-shot-configured-importer.yml
          git commit -m "Regenerate bundles with configured importer"
          git push

name: One-shot GitHub source fallback validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Tighten missing-file probing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/github.ts")
          text = path.read_text()
          old = '''  } catch (error: any) {
    if (error?.status === 404 || error?.code === "ERR_PRIVATE_GITHUB_FETCH") return false;
    return false;
  }
}'''
          new = '''  } catch (error: any) {
    if (error?.status === 404) return false;
    throw error;
  }
}'''
          if old not in text:
              raise SystemExit("Expected githubFileExists block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test source
        run: npm test

      - name: Build single-file bundles
        run: npm run bundles

      - name: Test regenerated outputs
        run: npm test

      - name: Commit validated source and bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/github.ts build/bundle.ts build/bundle.mjs
          git rm .github/workflows/one-shot-github-source-fallback.yml
          git commit -m "Fix GitHub root source fallback"
          git push

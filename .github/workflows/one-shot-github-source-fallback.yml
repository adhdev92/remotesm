name: One-shot GitHub source fallback validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Validate, rebuild, and report
        shell: bash
        run: |
          set +e
          LOG=.github/source-fallback-validation.log
          npm ci > "$LOG" 2>&1
          INSTALL=$?
          npm test >> "$LOG" 2>&1
          TEST=$?
          npm run bundles >> "$LOG" 2>&1
          BUILD=$?
          npm test >> "$LOG" 2>&1
          RETEST=$?
          echo "INSTALL=$INSTALL TEST=$TEST BUILD=$BUILD RETEST=$RETEST" >> "$LOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG"
          if [ "$INSTALL" -eq 0 ] && [ "$TEST" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$RETEST" -eq 0 ]; then
            git add build/bundle.ts build/bundle.mjs
          fi
          git commit -m "Record GitHub source fallback validation"
          git push

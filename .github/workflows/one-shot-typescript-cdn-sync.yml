name: One-shot TypeScript CDN sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate single-file bundles
        run: npm run bundles

      - name: Test
        run: npm test

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/bundle.ts build/bundle.mjs
          git rm .github/workflows/one-shot-typescript-cdn-sync.yml
          git commit -m "Rebuild bundles after TypeScript URL hardening"
          git push

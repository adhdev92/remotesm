name: One-shot TypeScript CDN sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Regenerate single-file bundles
        run: npm run bundles

      - name: Update legacy standalone fixture
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const version = packageJson.devDependencies?.typescript;
          const path = "tests/bundle.ts";
          const source = await readFile(path, "utf8");
          const next = source.replace(
            /https:\/\/esm\.sh\/typescript(?:@[^?"'`\s]+)?(?=\?target=es2022)/g,
            `https://esm.sh/typescript@${version}`,
          );

          if (next === source) {
            throw new Error(`Expected ${path} to contain the legacy TypeScript CDN URL.`);
          }

          await writeFile(path, next);
          NODE

      - name: Test
        run: npm test

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json build/bundle.ts build/bundle.mjs tests/bundle.ts
          git rm .github/workflows/one-shot-typescript-cdn-sync.yml
          git commit -m "Regenerate bundles with pinned TypeScript CDN version"
          git push

name: One-shot root resolution fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Apply patch
        run: python .github/patch-root-resolution.py

      - name: Install dependencies
        run: npm ci

      - name: Test source
        run: npm test

      - name: Rebuild single-file bundles
        run: npm run bundles

      - name: Test rebuilt outputs
        run: npm test

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/github.ts tests/privateGithubSourceFallback.test.ts build/bundle.ts build/bundle.mjs
          git rm .github/patch-root-resolution.py .github/workflows/one-shot-root-resolution-fix.yml
          git commit -m "Fix GitHub source fallback under remoteFetch"
          git push
